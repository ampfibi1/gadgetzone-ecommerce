services:
  # Backend API Service
  - type: web
    name: gadgetzone-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: gadgetzone-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        value: admin@gadgetzone.com
      - key: ADMIN_PASSWORD
        value: Admin@123456
      - key: BKASH_BASE_URL
        value: https://tokenized.sandbox.bka.sh/v1.2.0-beta
      - key: FRONTEND_URL
        fromService:
          type: web
          name: gadgetzone-ui
          property: host

  # Frontend Static Site
  - type: web
    name: gadgetzone-ui
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: gadgetzone-api
          property: host
          value: https://$gadgetzone-api.onrender.com/api

databases:
  - name: gadgetzone-db
    plan: free
    region: oregon
    databaseName: gadgetzone
    user: gadgetzone_admin
