# Keep the free Render web service (gadgetzone-api) awake.
# Render free web services sleep after 15 minutes with no inbound traffic, and a
# self-ping from inside the Node process is not inbound traffic, so the ping runs
# here in GitHub Actions instead. No repository access is needed: the job only
# makes one outbound HTTP request.
name: Keep Render API awake

on:
  schedule:
    # Every 5 minutes (GitHub's minimum interval); scheduled runs may be delayed.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  # Never cancel a run that is still waiting on a Render cold start.
  group: render-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        # Override with a repository Actions variable:
        # Settings -> Secrets and variables -> Actions -> Variables -> RENDER_HEALTH_URL.
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL || 'https://gadgetzone-api.onrender.com/api/health' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Pinging ${HEALTH_URL} ..."

          # Accept: application/json keeps this in Render's API-client path, where
          # the request is held through the cold start. Browser requests instead
          # receive an immediate 503 loading page.
          if ! body="$(curl \
            --silent \
            --show-error \
            --fail \
            --location \
            --header "Accept: application/json" \
            --max-time 120 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            "${HEALTH_URL}")"; then
            echo "::error::Health request to ${HEALTH_URL} failed after retries."
            exit 1
          fi

          echo "Response body:"
          echo "${body}"

          if ! jq -e '.success == true' <<<"${body}" >/dev/null; then
            echo "::error::Health endpoint responded but did not report success=true."
            exit 1
          fi

          echo "API is awake and healthy."
